services:
  web:
    build:
      context: .
      target: web
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    tmpfs:
      - /tmp:mode=1777
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REQVALIDATOR_API_KEY: ${REQVALIDATOR_API_KEY:-}
      REQVALIDATOR_PROVIDER: ${REQVALIDATOR_PROVIDER:-openai}
      REQVALIDATOR_MODEL: ${REQVALIDATOR_MODEL:-gpt-6.2-sol}
      REQVALIDATOR_BASE_URL: ${REQVALIDATOR_BASE_URL:-}
      REQVALIDATOR_REASONING_EFFORT: ${REQVALIDATOR_REASONING_EFFORT:-}
      REQVALIDATOR_COMPATIBLE_FORMAT: ${REQVALIDATOR_COMPATIBLE_FORMAT:-json_object}
      REQVALIDATOR_TEMPERATURE: ${REQVALIDATOR_TEMPERATURE:-}
      REQVALIDATOR_SEED: ${REQVALIDATOR_SEED:-}
      REQVALIDATOR_MAX_OUTPUT_TOKENS: ${REQVALIDATOR_MAX_OUTPUT_TOKENS:-}
      REQVALIDATOR_TIMEOUT: ${REQVALIDATOR_TIMEOUT:-90}
      REQVALIDATOR_VALIDATION_RETRIES: ${REQVALIDATOR_VALIDATION_RETRIES:-2}
      REQVALIDATOR_MAX_INPUT_CHARS: ${REQVALIDATOR_MAX_INPUT_CHARS:-100000}
      REQVALIDATOR_LOCAL_BATCH_SIZE: ${REQVALIDATOR_LOCAL_BATCH_SIZE:-6}
      REQVALIDATOR_MIN_REQUEST_INTERVAL: ${REQVALIDATOR_MIN_REQUEST_INTERVAL:-0}
      REQVALIDATOR_CONCURRENCY: ${REQVALIDATOR_CONCURRENCY:-3}
      REQVALIDATOR_QUIET: ${REQVALIDATOR_QUIET:-false}
      REQVALIDATOR_MERGE_REASONING_EFFORT: ${REQVALIDATOR_MERGE_REASONING_EFFORT:-}
      REQVALIDATOR_REVIEWERS: ${REQVALIDATOR_REVIEWERS:-}
      REQVALIDATOR_REVIEWER_MAX_FINDINGS: ${REQVALIDATOR_REVIEWER_MAX_FINDINGS:-5}
      REQVALIDATOR_EXTERNAL_DOCS: ${REQVALIDATOR_EXTERNAL_DOCS:-false}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      REQVALIDATOR_VERSION: ${REQVALIDATOR_VERSION:-}
